# Roda os testes automatizados em todo pull request e envio.
name: Testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Banco de dados (migrations, RLS e regras)
        run: bash tests/sql/rodar.sh
      - name: Regras, prompt e função de servidor
        run: node --test tests/unit/*.test.js
      - name: Tipos da Edge Function
        run: bash scripts/checar-funcao.sh
