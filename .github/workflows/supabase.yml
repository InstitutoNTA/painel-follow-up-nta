# Aplica as migrations e publica a Edge Function no Supabase.
# Execução MANUAL (Actions → Supabase → Run workflow), para que mudanças no
# banco só aconteçam com aprovação. Segredos necessários no repositório
# (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
name: Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Aplicar migrations
        run: supabase db push
      - name: Publicar Edge Function
        run: supabase functions deploy gerar-mensagem --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
