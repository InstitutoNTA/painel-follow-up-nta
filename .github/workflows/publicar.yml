# Publica o site no GitHub Pages depois que os testes passam na branch main.
# Só os arquivos do site são publicados (sem testes nem migrations).
# Pré-requisito: Settings → Pages → Source = "GitHub Actions".
name: Publicar site
on:
  workflow_run:
    workflows: [Testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar a pasta do site
        run: |
          mkdir -p _site/supabase/functions/_shared
          cp -r index.html assets .nojekyll _site/
          cp supabase/functions/_shared/regras.js _site/supabase/functions/_shared/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
